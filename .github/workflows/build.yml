      - name: Create app/src/main/java/com/example/offlineplayer/VideoRepository.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/VideoRepository.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/VideoRepository.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.content.ContentUris
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import java.io.File

          data class VideoItem(
              val id: Long,
              val uri: Uri,
              val title: String,
              val folder: String,
              val durationMs: Long,
              val sizeBytes: Long,
              val dateAdded: Long,
              val isAudio: Boolean,
              val path: String,
              val width: Int,
              val height: Int
          ) {
              /** Unique across videos and audio (their MediaStore ids can overlap). */
              val key: String get() = uri.toString()
          }

          data class FolderItem(val name: String, val count: Int)

          /** One entry of the play queue handed to the player screen. */
          data class PlayItem(val uri: Uri, val title: String)

          object PlayQueue {
              var items: List<PlayItem> = emptyList()
              var index: Int = 0
          }

          object VideoRepository {

              /** Reads every video and audio file from the device's MediaStore. Works fully offline. */
              @Suppress("DEPRECATION")
              fun loadAll(context: Context): List<VideoItem> {
                  val result = mutableListOf<VideoItem>()

                  // ---- Videos ----
                  val vCollection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val vProjection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.DISPLAY_NAME,
                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE,
                      MediaStore.Video.Media.DATE_ADDED,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.WIDTH,
                      MediaStore.Video.Media.HEIGHT
                  )
                  try {
                      context.contentResolver.query(vCollection, vProjection, null, null, null)?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                          val folderCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                          val durCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          val sizeCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val dateCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)
                          val dataCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                          val wCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.WIDTH)
                          val hCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.HEIGHT)
                          while (c.moveToNext()) {
                              val id = c.getLong(idCol)
                              result += VideoItem(
                                  id = id,
                                  uri = ContentUris.withAppendedId(vCollection, id),
                                  title = c.getString(nameCol) ?: "Unknown",
                                  folder = c.getString(folderCol) ?: "Unknown",
                                  durationMs = c.getLong(durCol),
                                  sizeBytes = c.getLong(sizeCol),
                                  dateAdded = c.getLong(dateCol),
                                  isAudio = false,
                                  path = c.getString(dataCol) ?: "",
                                  width = c.getInt(wCol),
                                  height = c.getInt(hCol)
                              )
                          }
                      }
                  } catch (e: Exception) {
                      // Videos not readable: keep going so audio can still show.
                  }

                  // ---- Audio (folder is taken from the file path so it works on every Android version) ----
                  val aCollection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val aProjection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME,
                      MediaStore.Audio.Media.DURATION,
                      MediaStore.Audio.Media.SIZE,
                      MediaStore.Audio.Media.DATE_ADDED,
                      MediaStore.Audio.Media.DATA
                  )
                  try {
                      context.contentResolver.query(aCollection, aProjection, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, null)?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val nameCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME)
                          val durCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          val sizeCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)
                          val dateCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)
                          val dataCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
                          while (c.moveToNext()) {
                              val id = c.getLong(idCol)
                              val path = c.getString(dataCol) ?: ""
                              val folder = if (path.isNotEmpty()) File(path).parentFile?.name ?: "Audio" else "Audio"
                              result += VideoItem(
                                  id = id,
                                  uri = ContentUris.withAppendedId(aCollection, id),
                                  title = c.getString(nameCol) ?: "Unknown",
                                  folder = folder,
                                  durationMs = c.getLong(durCol),
                                  sizeBytes = c.getLong(sizeCol),
                                  dateAdded = c.getLong(dateCol),
                                  isAudio = true,
                                  path = path,
                                  width = 0,
                                  height = 0
                              )
                          }
                      }
                  } catch (e: Exception) {
                      // Audio not readable (permission not granted): ignore.
                  }

                  return result
              }
          }

          fun formatDuration(ms: Long): String {
              val totalSec = ms / 1000
              val h = totalSec / 3600
              val m = (totalSec % 3600) / 60
              val s = totalSec % 60
              return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%d:%02d".format(m, s)
          }

          fun formatSize(bytes: Long): String = when {
              bytes >= 1L shl 30 -> "%.1f GB".format(bytes / (1L shl 30).toDouble())
              bytes >= 1L shl 20 -> "%.0f MB".format(bytes / (1L shl 20).toDouble())
              else -> "%d KB".format(bytes / 1024)
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/Store.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/Store.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/Store.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.content.Context
          import androidx.appcompat.app.AppCompatDelegate
          import org.json.JSONArray
          import java.security.MessageDigest

          /** Everything PlayTab remembers. Local SharedPreferences only, nothing leaves the phone. */
          object Store {

              private fun p(c: Context) = c.getSharedPreferences("playtab_prefs", Context.MODE_PRIVATE)

              // ---- Theme: 0 = follow system, 1 = light, 2 = dark ----
              fun theme(c: Context) = p(c).getInt("theme", 0)
              fun setTheme(c: Context, mode: Int) = p(c).edit().putInt("theme", mode).apply()

              fun applyTheme(c: Context) {
                  val mode = when (theme(c)) {
                      1 -> AppCompatDelegate.MODE_NIGHT_NO
                      2 -> AppCompatDelegate.MODE_NIGHT_YES
                      else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                  }
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              // ---- Decoder: 0 = hardware, 1 = software first. Default plus per-video choice. ----
              fun defaultDecoder(c: Context) = p(c).getInt("decoder_default", 0)
              fun setDefaultDecoder(c: Context, mode: Int) = p(c).edit().putInt("decoder_default", mode).apply()
              fun decoderFor(c: Context, key: String) = p(c).getInt("dec_$key", defaultDecoder(c))
              fun setDecoderFor(c: Context, key: String, mode: Int) = p(c).edit().putInt("dec_$key", mode).apply()

              // ---- Library view ----
              fun grid(c: Context) = p(c).getBoolean("grid", false)
              fun setGrid(c: Context, on: Boolean) = p(c).edit().putBoolean("grid", on).apply()

              /** 0 name, 1 newest, 2 largest, 3 longest */
              fun sort(c: Context) = p(c).getInt("sort", 1)
              fun setSort(c: Context, v: Int) = p(c).edit().putInt("sort", v).apply()

              /** 0 all, 1 videos only, 2 audio only */
              fun filter(c: Context) = p(c).getInt("filter", 0)
              fun setFilter(c: Context, v: Int) = p(c).edit().putInt("filter", v).apply()

              // ---- Recently played (newest first, max 30) ----
              fun recents(c: Context): List<String> {
                  val raw = p(c).getString("recents", null) ?: return emptyList()
                  return try {
                      val arr = JSONArray(raw)
                      (0 until arr.length()).map { arr.getString(it) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun addRecent(c: Context, key: String) {
                  val list = recents(c).toMutableList()
                  list.remove(key)
                  list.add(0, key)
                  val trimmed = list.take(30)
                  val arr = JSONArray()
                  trimmed.forEach { arr.put(it) }
                  p(c).edit().putString("recents", arr.toString()).apply()
              }

              fun clearRecents(c: Context) = p(c).edit().remove("recents").apply()

              // ---- Private folder: hidden items plus a PIN ----
              fun hidden(c: Context): Set<String> = HashSet(p(c).getStringSet("hidden", emptySet()) ?: emptySet())

              fun setHidden(c: Context, key: String, hide: Boolean) {
                  val set = HashSet(hidden(c))
                  if (hide) set.add(key) else set.remove(key)
                  p(c).edit().putStringSet("hidden", set).apply()
              }

              private fun hash(pin: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest("playtab:$pin".toByteArray())
                      .joinToString("") { "%02x".format(it) }

              fun hasPin(c: Context) = p(c).getString("pin", null) != null
              fun setPin(c: Context, pin: String) = p(c).edit().putString("pin", hash(pin)).apply()
              fun checkPin(c: Context, pin: String) = p(c).getString("pin", null) == hash(pin)

              // ---- Equalizer and volume boost ----
              fun eqLevels(c: Context): List<Int> =
                  (p(c).getString("eq", "") ?: "").split(",").mapNotNull { it.toIntOrNull() }

              fun setEqLevels(c: Context, levels: List<Int>) =
                  p(c).edit().putString("eq", levels.joinToString(",")).apply()

              /** 0..100, where 100 is about +10 dB of extra gain. */
              fun boost(c: Context) = p(c).getInt("boost", 0)
              fun setBoost(c: Context, v: Int) = p(c).edit().putInt("boost", v).apply()
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/RowAdapter.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/RowAdapter.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/RowAdapter.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.LruCache
          import android.util.Size
          import android.view.MotionEvent
          import android.view.animation.OvershootInterpolator
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import java.util.concurrent.Executors

          /** One row in the list: a folder, a special entry (Recent / Private) or a media file. */
          data class Row(
              val title: String,
              val subtitle: String,
              val video: VideoItem? = null,
              val folder: FolderItem? = null,
              /** 0 = normal, 1 = Recently played, 2 = Private */
              val special: Int = 0
          )

          class RowAdapter(
              private val context: Context,
              private val onClick: (Row) -> Unit,
              private val onLongClick: (Row) -> Unit
          ) : RecyclerView.Adapter<RowAdapter.VH>() {

              var grid: Boolean = false

              private var rows: List<Row> = emptyList()
              private val pool = Executors.newFixedThreadPool(2)
              private val main = Handler(Looper.getMainLooper())
              private val cache = LruCache<String, Bitmap>(80)

              fun submit(newRows: List<Row>) {
                  rows = newRows
                  notifyDataSetChanged()
              }

              class VH(view: View) : RecyclerView.ViewHolder(view) {
                  val thumb: ImageView = view.findViewById(R.id.thumb)
                  val title: TextView = view.findViewById(R.id.title)
                  val subtitle: TextView = view.findViewById(R.id.subtitle)
                  val chevron: ImageView? = view.findViewById(R.id.chevron)
              }

              private fun dp(v: Int) = (v * context.resources.displayMetrics.density).toInt()

              /** Shows a vector icon (folders, Recent, Private, audio) instead of a picture. */
              private fun showIcon(holder: VH, res: Int) {
                  holder.thumb.scaleType = ImageView.ScaleType.FIT_CENTER
                  val pad = dp(if (grid) 30 else 14)
                  holder.thumb.setPadding(pad, pad, pad, pad)
                  holder.thumb.setImageResource(res)
              }

              private fun showPicture(holder: VH) {
                  holder.thumb.scaleType = ImageView.ScaleType.CENTER_CROP
                  holder.thumb.setPadding(0, 0, 0, 0)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val layout = if (grid) R.layout.row_grid else R.layout.row_item
                  return VH(LayoutInflater.from(parent.context).inflate(layout, parent, false))
              }

              override fun getItemCount() = rows.size

              @Suppress("DEPRECATION")
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val row = rows[position]
                  holder.title.text = row.title
                  holder.subtitle.text = row.subtitle
                  holder.itemView.setOnClickListener { onClick(row) }
                  holder.itemView.setOnLongClickListener { onLongClick(row); true }

                  // Gentle press-in feel, like iOS
                  holder.itemView.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              v.animate().scaleX(1f).scaleY(1f).setDuration(220)
                                  .setInterpolator(OvershootInterpolator(2.5f)).start()
                      }
                      false
                  }

                  holder.chevron?.visibility = if (row.video == null) View.VISIBLE else View.GONE

                  val video = row.video
                  if (video == null) {
                      showIcon(
                          holder,
                          when (row.special) {
                              1 -> R.drawable.ic_history
                              2 -> R.drawable.ic_lock
                              else -> R.drawable.ic_folder
                          }
                      )
                      holder.thumb.tag = null
                      return
                  }

                  if (video.isAudio) showIcon(holder, R.drawable.ic_music_note) else {
                      showPicture(holder)
                      holder.thumb.setImageDrawable(null)
                  }
                  holder.thumb.tag = video.key
                  cache.get(video.key)?.let { showPicture(holder); holder.thumb.setImageBitmap(it); return }

                  pool.execute {
                      val bmp: Bitmap? = try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              context.contentResolver.loadThumbnail(video.uri, Size(320, 200), null)
                          } else if (!video.isAudio) {
                              MediaStore.Video.Thumbnails.getThumbnail(
                                  context.contentResolver, video.id, MediaStore.Video.Thumbnails.MINI_KIND, null
                              )
                          } else {
                              null
                          }
                      } catch (e: Exception) {
                          null
                      }
                      if (bmp != null) {
                          cache.put(video.key, bmp)
                          main.post {
                              if (holder.thumb.tag == video.key) {
                                  showPicture(holder)
                                  holder.thumb.setImageBitmap(bmp)
                              }
                          }
                      }
                  }
              }
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/MainActivity.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/MainActivity.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.Manifest
          import android.app.RecoverableSecurityException
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.text.InputType
          import android.view.Menu
          import android.view.MenuItem
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.IntentSenderRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import com.google.android.material.dialog.MaterialAlertDialogBuilder
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.widget.doAfterTextChanged
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.example.offlineplayer.databinding.ActivityMainBinding
          import java.text.DateFormat
          import java.util.Date

          class MainActivity : AppCompatActivity() {

              private enum class Screen { FOLDERS, FOLDER, RECENT, PRIVATE }

              private companion object {
                  const val MENU_SEARCH = 1
                  const val MENU_VIEW = 2
                  const val MENU_SORT = 3
                  const val MENU_FILTER = 4
                  const val MENU_SETTINGS = 5
              }

              private lateinit var binding: ActivityMainBinding
              private lateinit var adapter: RowAdapter

              private var allVideos: List<VideoItem> = emptyList()
              private var screen = Screen.FOLDERS
              private var openFolder: String? = null
              private var query = ""
              private var shownVideos: List<VideoItem> = emptyList() // the media rows currently on screen = the play queue
              private var pendingAction: (() -> Unit)? = null

              private val permissions: Array<String>
                  get() = when {
                      Build.VERSION.SDK_INT >= 33 -> arrayOf(
                          Manifest.permission.READ_MEDIA_VIDEO,
                          Manifest.permission.READ_MEDIA_AUDIO
                      )
                      Build.VERSION.SDK_INT >= 29 -> arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                      else -> arrayOf(
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      )
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      if (hasPermission()) loadVideos() else showPermissionNeeded()
                  }

              /** Used when Android asks the user to approve changing or deleting a file. */
              private val accessLauncher =
                  registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->
                      val action = pendingAction
                      pendingAction = null
                      if (result.resultCode == RESULT_OK) action?.invoke()
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  Store.applyTheme(this)
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  adapter = RowAdapter(this, { row -> onRowClicked(row) }, { row -> onRowLongClicked(row) })
                  adapter.grid = Store.grid(this)
                  applyLayoutManager()
                  binding.list.adapter = adapter

                  binding.grantButton.setOnClickListener { permissionLauncher.launch(permissions) }
                  setupMenu()
                  binding.toolbar.setNavigationOnClickListener { onBackPressedDispatcher.onBackPressed() }

                  binding.searchBar.doAfterTextChanged {
                      query = it?.toString() ?: ""
                      render()
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              binding.searchBar.visibility == View.VISIBLE -> closeSearch()
                              screen != Screen.FOLDERS -> {
                                  screen = Screen.FOLDERS
                                  openFolder = null
                                  render()
                              }
                              else -> {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  })

                  if (hasPermission()) loadVideos() else permissionLauncher.launch(permissions)
              }

              override fun onResume() {
                  super.onResume()
                  if (hasPermission()) loadVideos()
              }

              // ---- Toolbar ---------------------------------------------------------------------------

              private fun setupMenu() {
                  val menu = binding.toolbar.menu
                  menu.add(Menu.NONE, MENU_SEARCH, 0, "Search").setShowAsAction(MenuItem.SHOW_AS_ACTION_ALWAYS)
                  menu.add(Menu.NONE, MENU_VIEW, 1, if (adapter.grid) "List" else "Grid")
                      .setShowAsAction(MenuItem.SHOW_AS_ACTION_ALWAYS)
                  menu.add(Menu.NONE, MENU_SORT, 2, "Sort").setShowAsAction(MenuItem.SHOW_AS_ACTION_NEVER)
                  menu.add(Menu.NONE, MENU_FILTER, 3, "Filter").setShowAsAction(MenuItem.SHOW_AS_ACTION_NEVER)
                  menu.add(Menu.NONE, MENU_SETTINGS, 4, "Settings").setShowAsAction(MenuItem.SHOW_AS_ACTION_NEVER)

                  binding.toolbar.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          MENU_SEARCH -> toggleSearch()
                          MENU_VIEW -> {
                              adapter.grid = !adapter.grid
                              Store.setGrid(this, adapter.grid)
                              item.title = if (adapter.grid) "List" else "Grid"
                              applyLayoutManager()
                              binding.list.adapter = adapter
                              render()
                          }
                          MENU_SORT -> showSortDialog()
                          MENU_FILTER -> showFilterDialog()
                          MENU_SETTINGS -> showSettings()
                      }
                      true
                  }
              }

              private fun applyLayoutManager() {
                  binding.list.layoutManager =
                      if (adapter.grid) GridLayoutManager(this, 2) else LinearLayoutManager(this)
              }

              private fun toggleSearch() {
                  if (binding.searchBar.visibility == View.VISIBLE) {
                      closeSearch()
                  } else {
                      binding.searchBar.visibility = View.VISIBLE
                      binding.searchBar.requestFocus()
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showSoftInput(binding.searchBar, InputMethodManager.SHOW_IMPLICIT)
                  }
              }

              private fun closeSearch() {
                  binding.searchBar.setText("")
                  binding.searchBar.visibility = View.GONE
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(binding.searchBar.windowToken, 0)
                  query = ""
                  render()
              }

              // ---- Permission and loading ------------------------------------------------------------

              private fun hasPermission() =
                  ContextCompat.checkSelfPermission(this, permissions[0]) == PackageManager.PERMISSION_GRANTED

              private fun showPermissionNeeded() {
                  binding.permissionGroup.visibility = View.VISIBLE
                  binding.list.visibility = View.GONE
                  binding.empty.visibility = View.GONE
              }

              private fun loadVideos() {
                  binding.permissionGroup.visibility = View.GONE
                  Thread {
                      val videos = VideoRepository.loadAll(this)
                      runOnUiThread {
                          allVideos = videos
                          render()
                      }
                  }.start()
              }

              // ---- Building the list -----------------------------------------------------------------

              private fun passesFilter(v: VideoItem) = when (Store.filter(this)) {
                  1 -> !v.isAudio
                  2 -> v.isAudio
                  else -> true
              }

              private fun sortVideos(list: List<VideoItem>): List<VideoItem> = when (Store.sort(this)) {
                  0 -> list.sortedBy { it.title.lowercase() }
                  1 -> list.sortedByDescending { it.dateAdded }
                  2 -> list.sortedByDescending { it.sizeBytes }
                  else -> list.sortedByDescending { it.durationMs }
              }

              private fun isNew(v: VideoItem) =
                  (System.currentTimeMillis() / 1000 - v.dateAdded) < 3 * 24 * 3600

              private fun mediaRow(v: VideoItem): Row {
                  val tag = if (isNew(v)) "NEW  •  " else ""
                  val kind = if (v.isAudio) "Audio  •  " else ""
                  return Row(v.title, "$tag$kind${formatDuration(v.durationMs)}  •  ${formatSize(v.sizeBytes)}", video = v)
              }

              private fun render() {
                  val hidden = Store.hidden(this)
                  val visible = allVideos.filter { it.key !in hidden && passesFilter(it) }
                  val rows: List<Row>
                  val title: String

                  if (query.isNotBlank()) {
                      title = "Search"
                      shownVideos = sortVideos(visible.filter { it.title.contains(query.trim(), ignoreCase = true) })
                      rows = shownVideos.map { mediaRow(it) }
                  } else {
                      when (screen) {
                          Screen.FOLDERS -> {
                              title = "PlayTab"
                              shownVideos = emptyList()
                              val list = mutableListOf<Row>()
                              val recentCount = resolveRecents(hidden).size
                              if (recentCount > 0) {
                                  list += Row("Recently played", "$recentCount item${if (recentCount == 1) "" else "s"}", special = 1)
                              }
                              list += Row("Private", "PIN protected", special = 2)
                              visible.groupBy { it.folder }
                                  .map { (name, items) -> FolderItem(name, items.size) }
                                  .sortedBy { it.name.lowercase() }
                                  .forEach {
                                      list += Row(it.name, "${it.count} item${if (it.count == 1) "" else "s"}", folder = it)
                                  }
                              rows = list
                          }
                          Screen.FOLDER -> {
                              title = openFolder ?: "PlayTab"
                              shownVideos = sortVideos(visible.filter { it.folder == openFolder })
                              rows = shownVideos.map { mediaRow(it) }
                          }
                          Screen.RECENT -> {
                              title = "Recently played"
                              shownVideos = resolveRecents(hidden).filter { passesFilter(it) }
                              rows = shownVideos.map { mediaRow(it) }
                          }
                          Screen.PRIVATE -> {
                              title = "Private"
                              shownVideos = sortVideos(allVideos.filter { it.key in hidden })
                              rows = shownVideos.map { mediaRow(it) }
                          }
                      }
                  }

                  binding.largeTitle.text = title
                  if (query.isBlank() && screen != Screen.FOLDERS) {
                      binding.toolbar.setNavigationIcon(R.drawable.ic_chevron_back)
                  } else {
                      binding.toolbar.navigationIcon = null
                  }
                  adapter.submit(rows)
                  binding.list.visibility = if (rows.isEmpty()) View.GONE else View.VISIBLE
                  binding.empty.visibility = if (rows.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun resolveRecents(hidden: Set<String>): List<VideoItem> {
                  val byKey = allVideos.associateBy { it.key }
                  return Store.recents(this).mapNotNull { byKey[it] }.filter { it.key !in hidden }
              }

              // ---- Clicks ----------------------------------------------------------------------------

              private fun onRowClicked(row: Row) {
                  when (row.special) {
                      1 -> { screen = Screen.RECENT; render(); return }
                      2 -> { openPrivate(); return }
                  }
                  row.folder?.let {
                      screen = Screen.FOLDER
                      openFolder = it.name
                      render()
                      return
                  }
                  row.video?.let { play(it) }
              }

              private fun play(v: VideoItem) {
                  val list = if (shownVideos.isEmpty()) listOf(v) else shownVideos
                  PlayQueue.items = list.map { PlayItem(it.uri, it.title) }
                  PlayQueue.index = list.indexOfFirst { it.key == v.key }.coerceAtLeast(0)
                  startActivity(
                      Intent(this, PlayerActivity::class.java).apply {
                          data = v.uri
                          putExtra(PlayerActivity.EXTRA_USE_QUEUE, true)
                      }
                  )
              }

              private fun onRowLongClicked(row: Row) {
                  val v = row.video ?: return
                  val inPrivate = Store.hidden(this).contains(v.key)
                  val options = arrayOf(
                      "Play",
                      "Rename",
                      "Share",
                      "Info",
                      if (inPrivate) "Remove from Private" else "Move to Private",
                      "Delete"
                  )
                  MaterialAlertDialogBuilder(this)
                      .setTitle(v.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> play(v)
                              1 -> renameDialog(v)
                              2 -> share(v)
                              3 -> showInfo(v)
                              4 -> if (inPrivate) {
                                  Store.setHidden(this, v.key, false)
                                  render()
                              } else {
                                  ensurePin {
                                      Store.setHidden(this, v.key, true)
                                      render()
                                      toast("Moved to Private")
                                  }
                              }
                              5 -> confirmDelete(v)
                          }
                      }
                      .show()
              }

              // ---- File actions: share, info, rename, delete ------------------------------------------

              private fun share(v: VideoItem) {
                  val send = Intent(Intent.ACTION_SEND).apply {
                      type = if (v.isAudio) "audio/*" else "video/*"
                      putExtra(Intent.EXTRA_STREAM, v.uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  startActivity(Intent.createChooser(send, "Share"))
              }

              private fun showInfo(v: VideoItem) {
                  val added = DateFormat.getDateTimeInstance().format(Date(v.dateAdded * 1000))
                  val lines = mutableListOf(
                      "Name: ${v.title}",
                      "Folder: ${v.folder}",
                      "Duration: ${formatDuration(v.durationMs)}",
                      "Size: ${formatSize(v.sizeBytes)}",
                      "Added: $added"
                  )
                  if (!v.isAudio && v.width > 0) lines += "Resolution: ${v.width} x ${v.height}"
                  if (v.path.isNotEmpty()) lines += "Path: ${v.path}"
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Info")
                      .setMessage(lines.joinToString("\n"))
                      .setPositiveButton("OK", null)
                      .show()
              }

              private fun renameDialog(v: VideoItem) {
                  val input = EditText(this).apply { setText(v.title) }
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Rename")
                      .setView(input)
                      .setPositiveButton("Rename") { _, _ ->
                          var name = input.text.toString().trim()
                          if (name.isEmpty()) return@setPositiveButton
                          val ext = v.title.substringAfterLast('.', "")
                          if (ext.isNotEmpty() && !name.endsWith(".$ext", ignoreCase = true)) name = "$name.$ext"
                          val finalName = name
                          withWriteAccess(v) { doRename(v, finalName) }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              /** On Android 11+ we ask the system for permission to edit the file first. */
              private fun withWriteAccess(v: VideoItem, action: () -> Unit) {
                  if (Build.VERSION.SDK_INT >= 30) {
                      val sender = MediaStore.createWriteRequest(contentResolver, listOf(v.uri)).intentSender
                      pendingAction = action
                      accessLauncher.launch(IntentSenderRequest.Builder(sender).build())
                  } else {
                      action()
                  }
              }

              private fun doRename(v: VideoItem, newName: String) {
                  try {
                      val values = ContentValues().apply { put(MediaStore.MediaColumns.DISPLAY_NAME, newName) }
                      contentResolver.update(v.uri, values, null, null)
                      toast("Renamed")
                      loadVideos()
                  } catch (e: SecurityException) {
                      if (Build.VERSION.SDK_INT >= 29 && e is RecoverableSecurityException) {
                          pendingAction = { doRename(v, newName) }
                          accessLauncher.launch(
                              IntentSenderRequest.Builder(e.userAction.actionIntent.intentSender).build()
                          )
                      } else {
                          toast("Can't rename this file")
                      }
                  } catch (e: Exception) {
                      toast("Can't rename this file")
                  }
              }

              private fun confirmDelete(v: VideoItem) {
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Delete?")
                      .setMessage("${v.title} will be removed from your phone.")
                      .setPositiveButton("Delete") { _, _ ->
                          if (Build.VERSION.SDK_INT >= 30) {
                              val sender = MediaStore.createDeleteRequest(contentResolver, listOf(v.uri)).intentSender
                              pendingAction = {
                                  Store.setHidden(this, v.key, false)
                                  loadVideos()
                              }
                              accessLauncher.launch(IntentSenderRequest.Builder(sender).build())
                          } else {
                              doDelete(v)
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun doDelete(v: VideoItem) {
                  try {
                      contentResolver.delete(v.uri, null, null)
                      Store.setHidden(this, v.key, false)
                      loadVideos()
                  } catch (e: SecurityException) {
                      if (Build.VERSION.SDK_INT >= 29 && e is RecoverableSecurityException) {
                          pendingAction = { doDelete(v) }
                          accessLauncher.launch(
                              IntentSenderRequest.Builder(e.userAction.actionIntent.intentSender).build()
                          )
                      } else {
                          toast("Can't delete this file")
                      }
                  } catch (e: Exception) {
                      toast("Can't delete this file")
                  }
              }

              // ---- Private folder (PIN) ---------------------------------------------------------------

              private fun pinInput() = EditText(this).apply {
                  inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                  hint = "PIN"
              }

              private fun openPrivate() {
                  if (!Store.hasPin(this)) {
                      createPin { screen = Screen.PRIVATE; render() }
                  } else {
                      askPin { screen = Screen.PRIVATE; render() }
                  }
              }

              /** Runs [then] once a PIN exists (asking the user to create one the first time). */
              private fun ensurePin(then: () -> Unit) {
                  if (Store.hasPin(this)) then() else createPin(then)
              }

              private fun askPin(onOk: () -> Unit) {
                  val input = pinInput()
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Enter PIN")
                      .setView(input)
                      .setPositiveButton("Open") { _, _ ->
                          if (Store.checkPin(this, input.text.toString())) onOk() else toast("Wrong PIN")
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun createPin(onDone: () -> Unit) {
                  val first = pinInput()
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Create a PIN (4 or more digits)")
                      .setView(first)
                      .setPositiveButton("Next") { _, _ ->
                          val pin = first.text.toString()
                          if (pin.length < 4) {
                              toast("PIN must be at least 4 digits")
                              return@setPositiveButton
                          }
                          val again = pinInput()
                          MaterialAlertDialogBuilder(this)
                              .setTitle("Confirm PIN")
                              .setView(again)
                              .setPositiveButton("Save") { _, _ ->
                                  if (again.text.toString() == pin) {
                                      Store.setPin(this, pin)
                                      onDone()
                                  } else {
                                      toast("PINs did not match")
                                  }
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              // ---- Sort, filter, settings --------------------------------------------------------------

              private fun showSortDialog() {
                  val items = arrayOf("Name (A to Z)", "Newest first", "Largest first", "Longest first")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Sort by")
                      .setSingleChoiceItems(items, Store.sort(this)) { d, which ->
                          Store.setSort(this, which)
                          d.dismiss()
                          render()
                      }
                      .show()
              }

              private fun showFilterDialog() {
                  val items = arrayOf("Videos and audio", "Videos only", "Audio only")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Show")
                      .setSingleChoiceItems(items, Store.filter(this)) { d, which ->
                          Store.setFilter(this, which)
                          d.dismiss()
                          render()
                      }
                      .show()
              }

              private fun showSettings() {
                  val items = arrayOf(
                      "Theme",
                      "Default decoder",
                      "Change Private PIN",
                      "Clear recently played",
                      "Forget resume positions"
                  )
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Settings")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> themeDialog()
                              1 -> decoderDialog()
                              2 -> if (Store.hasPin(this)) askPin { createPin { toast("PIN changed") } } else createPin { toast("PIN saved") }
                              3 -> { Store.clearRecents(this); render(); toast("Cleared") }
                              4 -> {
                                  getSharedPreferences("resume_positions", MODE_PRIVATE).edit().clear().apply()
                                  toast("Cleared")
                              }
                          }
                      }
                      .show()
              }

              private fun themeDialog() {
                  val items = arrayOf("Follow system", "Light", "Dark")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Theme")
                      .setSingleChoiceItems(items, Store.theme(this)) { d, which ->
                          Store.setTheme(this, which)
                          d.dismiss()
                          Store.applyTheme(this)
                      }
                      .show()
              }

              private fun decoderDialog() {
                  val items = arrayOf("Hardware (default, fastest)", "Software first (for videos that won't play)")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Default decoder")
                      .setSingleChoiceItems(items, Store.defaultDecoder(this)) { d, which ->
                          Store.setDefaultDecoder(this, which)
                          d.dismiss()
                      }
                      .show()
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/PlayerActivity.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/PlayerActivity.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/PlayerActivity.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.media.AudioManager
          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.util.Rational
          import android.view.GestureDetector
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import com.google.android.material.dialog.MaterialAlertDialogBuilder
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.mediacodec.MediaCodecSelector
          import androidx.media3.exoplayer.mediacodec.MediaCodecUtil
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.TrackSelectionDialogBuilder
          import com.example.offlineplayer.databinding.ActivityPlayerBinding
          import kotlin.math.abs

          class PlayerActivity : AppCompatActivity() {

              companion object {
                  const val EXTRA_USE_QUEUE = "use_queue"
                  private const val PREFS = "resume_positions"
                  private val SPEEDS = floatArrayOf(0.25f, 0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f, 3f, 4f)
                  private val RESIZE_MODES = intArrayOf(
                      AspectRatioFrameLayout.RESIZE_MODE_FIT,
                      AspectRatioFrameLayout.RESIZE_MODE_FILL,
                      AspectRatioFrameLayout.RESIZE_MODE_ZOOM,
                      AspectRatioFrameLayout.RESIZE_MODE_FIXED_WIDTH,
                      AspectRatioFrameLayout.RESIZE_MODE_FIXED_HEIGHT
                  )
                  private val RESIZE_NAMES = arrayOf("Fit", "Stretch", "Crop", "Width", "Height")
              }

              private lateinit var binding: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private lateinit var audioManager: AudioManager

              private var speedIndex = 3
              private var resizeIndex = 0
              private var orientationIndex = 0 // 0 auto, 1 landscape, 2 portrait
              private var nightOn = false
              private var locked = false
              private var inPip = false
              private var decoderMode = 0 // 0 hardware, 1 software first
              private var repeatMode = Player.REPEAT_MODE_OFF
              private var shuffleOn = false
              private var longPressSpeedBackup = -1

              // Pinch zoom and pan
              private var zoom = 1f
              private var panX = 0f
              private var panY = 0f

              // A-B repeat
              private var markA = -1L
              private var markB = -1L

              // Effects
              private var equalizer: Equalizer? = null
              private var loudness: LoudnessEnhancer? = null

              private var hudHideRunnable: Runnable? = null
              private var unlockHideRunnable: Runnable? = null
              private var sleepRunnable: Runnable? = null

              private val abTick = object : Runnable {
                  override fun run() {
                      val p = player
                      if (p != null && markA >= 0 && markB > markA && p.currentPosition >= markB) {
                          p.seekTo(markA)
                      }
                      binding.root.postDelayed(this, 150)
                  }
              }

              private val listener = object : Player.Listener {
                  override fun onPlaybackStateChanged(state: Int) {
                      if (state == Player.STATE_ENDED) currentItem()?.let { clearPosition(it.uri) }
                  }

                  override fun onPositionDiscontinuity(
                      oldPosition: Player.PositionInfo,
                      newPosition: Player.PositionInfo,
                      reason: Int
                  ) {
                      if (oldPosition.mediaItemIndex != newPosition.mediaItemIndex) {
                          val old = PlayQueue.items.getOrNull(oldPosition.mediaItemIndex) ?: return
                          if (reason == Player.DISCONTINUITY_REASON_AUTO_TRANSITION) clearPosition(old.uri)
                          else savePosition(old.uri, oldPosition.positionMs)
                      }
                  }

                  override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                      val p = player ?: return
                      if (reason == Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED) return
                      PlayQueue.index = p.currentMediaItemIndex
                      val item = currentItem() ?: return
                      onItemStarted(item)
                      if (reason != Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT) {
                          val saved = savedPosition(item.uri)
                          if (saved > 0) p.seekTo(saved)
                      }
                      // Per-video decoder choice
                      val want = Store.decoderFor(this@PlayerActivity, item.uri.toString())
                      if (want != decoderMode) {
                          decoderMode = want
                          binding.root.post { reloadPlayer() }
                      }
                  }

                  override fun onAudioSessionIdChanged(audioSessionId: Int) {
                      setupEffects(audioSessionId)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  if (!(intent.getBooleanExtra(EXTRA_USE_QUEUE, false) && PlayQueue.items.isNotEmpty())) {
                      val data = intent.data ?: run { finish(); return }
                      PlayQueue.items = listOf(PlayItem(data, displayName(data)))
                      PlayQueue.index = 0
                  }

                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  decoderMode = currentItem()?.let { Store.decoderFor(this, it.uri.toString()) } ?: 0
                  binding.decoderButton.text = if (decoderMode == 1) "SW" else "HW"

                  goImmersive()
                  setupButtons()
                  setupGestures()
              }

              override fun onStart() {
                  super.onStart()
                  initPlayer()
              }

              override fun onStop() {
                  super.onStop()
                  releasePlayer()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  binding.root.removeCallbacks(abTick)
                  sleepRunnable?.let { binding.root.removeCallbacks(it) }
              }

              // ---- Player setup --------------------------------------------------------------------

              private fun currentItem(): PlayItem? = PlayQueue.items.getOrNull(PlayQueue.index)

              private fun codecSelector(mode: Int) = MediaCodecSelector { mimeType, secure, tunneling ->
                  val list = MediaCodecUtil.getDecoderInfos(mimeType, secure, tunneling)
                  if (mode == 1) list.sortedBy { if (it.softwareOnly) 0 else 1 } else list
              }

              private fun initPlayer(index: Int = PlayQueue.index, startAt: Long? = null) {
                  if (PlayQueue.items.isEmpty()) {
                      finish()
                      return
                  }
                  val factory = DefaultRenderersFactory(this)
                      .setEnableDecoderFallback(true)
                      .setMediaCodecSelector(codecSelector(decoderMode))
                  val exo = ExoPlayer.Builder(this, factory).build()
                  player = exo
                  binding.playerView.player = exo

                  // No subtitles in PlayTab: keep text tracks switched off.
                  exo.trackSelectionParameters = exo.trackSelectionParameters
                      .buildUpon()
                      .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                      .build()

                  val items = PlayQueue.items.map {
                      MediaItem.Builder().setUri(it.uri).setMediaId(it.uri.toString()).build()
                  }
                  val i = index.coerceIn(0, items.lastIndex)
                  PlayQueue.index = i
                  exo.setMediaItems(items, i, startAt ?: savedPosition(PlayQueue.items[i].uri))
                  exo.repeatMode = repeatMode
                  exo.shuffleModeEnabled = shuffleOn
                  exo.playbackParameters = PlaybackParameters(SPEEDS[speedIndex])
                  exo.addListener(listener)
                  exo.prepare()
                  exo.playWhenReady = true

                  binding.playerView.resizeMode = RESIZE_MODES[resizeIndex]
                  PlayQueue.items.getOrNull(i)?.let { onItemStarted(it) }
                  if (exo.audioSessionId != C.AUDIO_SESSION_ID_UNSET) setupEffects(exo.audioSessionId)

                  binding.root.removeCallbacks(abTick)
                  binding.root.post(abTick)
              }

              private fun onItemStarted(item: PlayItem) {
                  binding.titleText.text = item.title
                  Store.addRecent(this, item.uri.toString())
                  clearAB()
              }

              private fun reloadPlayer() {
                  val pos = player?.currentPosition ?: 0L
                  val idx = player?.currentMediaItemIndex ?: PlayQueue.index
                  releasePlayer()
                  initPlayer(index = idx, startAt = pos)
                  binding.decoderButton.text = if (decoderMode == 1) "SW" else "HW"
              }

              private fun releasePlayer() {
                  binding.root.removeCallbacks(abTick)
                  releaseEffects()
                  player?.let {
                      repeatMode = it.repeatMode
                      shuffleOn = it.shuffleModeEnabled
                      currentItem()?.let { item ->
                          if (it.playbackState != Player.STATE_ENDED) savePosition(item.uri, it.currentPosition)
                      }
                      it.removeListener(listener)
                      it.release()
                  }
                  player = null
              }

              // ---- Audio effects: equalizer and volume boost ---------------------------------------

              private fun setupEffects(sessionId: Int) {
                  releaseEffects()
                  if (sessionId <= 0) return
                  try {
                      val eq = Equalizer(0, sessionId)
                      eq.setEnabled(true)
                      val saved = Store.eqLevels(this)
                      val range = eq.bandLevelRange
                      for (b in 0 until eq.numberOfBands) {
                          val level = saved.getOrNull(b) ?: continue
                          eq.setBandLevel(b.toShort(), level.coerceIn(range[0].toInt(), range[1].toInt()).toShort())
                      }
                      equalizer = eq
                  } catch (e: Exception) {
                      equalizer = null
                  }
                  try {
                      val boost = Store.boost(this)
                      val le = LoudnessEnhancer(sessionId)
                      le.setTargetGain(boost * 10)
                      le.setEnabled(boost > 0)
                      loudness = le
                  } catch (e: Exception) {
                      loudness = null
                  }
              }

              private fun releaseEffects() {
                  try { equalizer?.release() } catch (e: Exception) { }
                  try { loudness?.release() } catch (e: Exception) { }
                  equalizer = null
                  loudness = null
              }

              private fun showEqualizer() {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 0)
                  }

                  // Volume boost
                  val boostLabel = TextView(this).apply { text = "Volume boost: ${Store.boost(this@PlayerActivity)}%" }
                  val boostBar = SeekBar(this).apply {
                      max = 100
                      progress = Store.boost(this@PlayerActivity)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, value: Int, fromUser: Boolean) {
                              boostLabel.text = "Volume boost: $value%"
                              if (!fromUser) return
                              Store.setBoost(this@PlayerActivity, value)
                              try {
                                  loudness?.setTargetGain(value * 10)
                                  loudness?.setEnabled(value > 0)
                              } catch (e: Exception) { }
                          }
                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  }
                  col.addView(boostLabel)
                  col.addView(boostBar)

                  // Equalizer bands
                  val eq = equalizer
                  if (eq == null) {
                      col.addView(TextView(this).apply {
                          text = "\nEqualizer is not available on this phone."
                      })
                  } else {
                      val range = eq.bandLevelRange
                      val min = range[0].toInt()
                      val levels = MutableList(eq.numberOfBands.toInt()) { eq.getBandLevel(it.toShort()).toInt() }
                      for (b in 0 until eq.numberOfBands) {
                          val hz = eq.getCenterFreq(b.toShort()) / 1000
                          val label = TextView(this).apply {
                              text = if (hz >= 1000) "${hz / 1000} kHz" else "$hz Hz"
                              setPadding(0, 24, 0, 0)
                          }
                          val bar = SeekBar(this).apply {
                              max = range[1].toInt() - min
                              progress = levels[b] - min
                              setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                                  override fun onProgressChanged(sb: SeekBar, value: Int, fromUser: Boolean) {
                                      if (!fromUser) return
                                      levels[b] = value + min
                                      try { eq.setBandLevel(b.toShort(), (value + min).toShort()) } catch (e: Exception) { }
                                      Store.setEqLevels(this@PlayerActivity, levels)
                                  }
                                  override fun onStartTrackingTouch(sb: SeekBar) {}
                                  override fun onStopTrackingTouch(sb: SeekBar) {}
                              })
                          }
                          col.addView(label)
                          col.addView(bar)
                      }
                  }

                  MaterialAlertDialogBuilder(this)
                      .setTitle("Equalizer and boost")
                      .setView(col)
                      .setPositiveButton("Done", null)
                      .show()
              }

              // ---- Top bar buttons ------------------------------------------------------------------

              private fun setupButtons() {
                  listOf(
                      binding.speedButton, binding.audioButton, binding.abButton, binding.ratioButton,
                      binding.rotateButton, binding.lockButton, binding.nightButton, binding.sleepButton,
                      binding.eqButton, binding.decoderButton, binding.queueButton, binding.pipButton
                  ).forEach { b -> b.setOnTouchListener { _, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) haptic()
                      false
                  } }
                  binding.speedButton.setOnClickListener { showSpeedDialog() }

                  binding.audioButton.setOnClickListener {
                      val p = player ?: return@setOnClickListener
                      TrackSelectionDialogBuilder(this, "Audio track", p, C.TRACK_TYPE_AUDIO)
                          .setAllowAdaptiveSelections(false)
                          .build()
                          .show()
                  }

                  binding.abButton.setOnClickListener {
                      val p = player ?: return@setOnClickListener
                      when {
                          markA < 0 -> {
                              markA = p.currentPosition
                              binding.abButton.text = "A ${formatDuration(markA)}"
                              showHud("A set")
                          }
                          markB < 0 -> {
                              if (p.currentPosition <= markA) {
                                  showHud("B must be after A")
                              } else {
                                  markB = p.currentPosition
                                  binding.abButton.text = "A-B on"
                                  showHud("Repeating A-B")
                              }
                          }
                          else -> {
                              clearAB()
                              showHud("A-B off")
                          }
                      }
                  }

                  binding.ratioButton.setOnClickListener {
                      resizeIndex = (resizeIndex + 1) % RESIZE_MODES.size
                      binding.playerView.resizeMode = RESIZE_MODES[resizeIndex]
                      binding.ratioButton.text = RESIZE_NAMES[resizeIndex]
                      resetZoom()
                      showHud(RESIZE_NAMES[resizeIndex])
                  }

                  binding.rotateButton.setOnClickListener {
                      orientationIndex = (orientationIndex + 1) % 3
                      when (orientationIndex) {
                          0 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                              binding.rotateButton.text = "Auto"
                          }
                          1 -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              binding.rotateButton.text = "Land"
                          }
                          else -> {
                              requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              binding.rotateButton.text = "Port"
                          }
                      }
                  }

                  binding.lockButton.setOnClickListener { setLocked(true) }
                  binding.unlockButton.setOnClickListener { setLocked(false) }
                  binding.lockOverlay.setOnClickListener { flashUnlock() }

                  binding.nightButton.setOnClickListener {
                      nightOn = !nightOn
                      binding.nightOverlay.visibility = if (nightOn) View.VISIBLE else View.GONE
                      binding.nightButton.text = if (nightOn) "Night on" else "Night"
                  }

                  binding.sleepButton.setOnClickListener { showSleepDialog() }
                  binding.eqButton.setOnClickListener { showEqualizer() }
                  binding.decoderButton.setOnClickListener { showDecoderDialog() }
                  binding.queueButton.setOnClickListener { showQueue() }
                  binding.pipButton.setOnClickListener { enterPip() }
              }

              private fun showSpeedDialog() {
                  val labels = SPEEDS.map { "${it}x".replace(".0x", "x") }.toTypedArray()
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Playback speed")
                      .setSingleChoiceItems(labels, speedIndex) { d, which ->
                          speedIndex = which
                          player?.playbackParameters = PlaybackParameters(SPEEDS[which])
                          binding.speedButton.text = labels[which]
                          d.dismiss()
                      }
                      .show()
              }

              private fun showSleepDialog() {
                  val labels = arrayOf("Off", "15 minutes", "30 minutes", "45 minutes", "60 minutes", "90 minutes")
                  val minutes = intArrayOf(0, 15, 30, 45, 60, 90)
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Sleep timer")
                      .setItems(labels) { _, which ->
                          sleepRunnable?.let { binding.root.removeCallbacks(it) }
                          sleepRunnable = null
                          if (minutes[which] == 0) {
                              binding.sleepButton.text = "Sleep"
                          } else {
                              val r = Runnable {
                                  player?.pause()
                                  binding.sleepButton.text = "Sleep"
                                  Toast.makeText(this, "Sleep timer: paused", Toast.LENGTH_LONG).show()
                              }
                              sleepRunnable = r
                              binding.root.postDelayed(r, minutes[which] * 60_000L)
                              binding.sleepButton.text = "Sleep ${minutes[which]}m"
                          }
                      }
                      .show()
              }

              private fun showDecoderDialog() {
                  val items = arrayOf("Hardware (default, fastest)", "Software first (for videos that won't play)")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Decoder for this video")
                      .setSingleChoiceItems(items, decoderMode) { d, which ->
                          d.dismiss()
                          currentItem()?.let { Store.setDecoderFor(this, it.uri.toString(), which) }
                          if (which != decoderMode) {
                              decoderMode = which
                              reloadPlayer()
                          }
                      }
                      .show()
              }

              private fun showQueue() {
                  val p = player ?: return
                  val titles = PlayQueue.items.mapIndexed { i, item ->
                      if (i == p.currentMediaItemIndex) "▶  ${item.title}" else item.title
                  }.toTypedArray()
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Queue")
                      .setItems(titles) { _, which -> p.seekToDefaultPosition(which) }
                      .show()
              }

              private fun clearAB() {
                  markA = -1L
                  markB = -1L
                  binding.abButton.text = "A-B"
              }

              // ---- Screen lock ------------------------------------------------------------------------

              private fun setLocked(on: Boolean) {
                  locked = on
                  haptic()
                  if (on) binding.playerView.hideController()
                  applyChrome()
                  if (on) flashUnlock()
              }

              private fun flashUnlock() {
                  binding.unlockButton.visibility = View.VISIBLE
                  unlockHideRunnable?.let { binding.unlockButton.removeCallbacks(it) }
                  val hide = Runnable { binding.unlockButton.visibility = View.GONE }
                  unlockHideRunnable = hide
                  binding.unlockButton.postDelayed(hide, 2500)
              }

              private fun applyChrome() {
                  val showUi = !inPip && !locked
                  binding.topBar.visibility = if (showUi) View.VISIBLE else View.GONE
                  binding.gestureLayer.visibility = if (inPip) View.GONE else View.VISIBLE
                  binding.playerView.useController = showUi
                  binding.lockOverlay.visibility = if (locked && !inPip) View.VISIBLE else View.GONE
              }

              // ---- Gestures: left side up/down = brightness, right side up/down = volume,
              //      horizontal swipe = seek, double-tap = skip 10 s, single tap = controls,
              //      long-press = 2x while held, pinch = zoom, two-finger drag = pan -------------------

              private fun setupGestures() {
                  var mode = 0 // 0 none, 1 brightness, 2 volume, 3 seek
                  var startPos = 0L
                  var seekTarget = 0L
                  var startBrightness = 0.5f
                  var startVolume = 0
                  var scaling = false
                  var lastFocusX = 0f
                  var lastFocusY = 0f

                  val scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScaleBegin(d: ScaleGestureDetector): Boolean {
                          scaling = true
                          lastFocusX = d.focusX
                          lastFocusY = d.focusY
                          return true
                      }

                      override fun onScale(d: ScaleGestureDetector): Boolean {
                          zoom = (zoom * d.scaleFactor).coerceIn(1f, 4f)
                          panX += d.focusX - lastFocusX
                          panY += d.focusY - lastFocusY
                          lastFocusX = d.focusX
                          lastFocusY = d.focusY
                          applyZoom()
                          showHud("${(zoom * 100).toInt()}%")
                          return true
                      }

                      override fun onScaleEnd(d: ScaleGestureDetector) {
                          scaling = false
                      }
                  })

                  val detector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean {
                          mode = 0
                          startPos = player?.currentPosition ?: 0L
                          seekTarget = startPos
                          startBrightness = window.attributes.screenBrightness.let { if (it < 0) 0.5f else it }
                          startVolume = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                          return true
                      }

                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (binding.playerView.isControllerFullyVisible) binding.playerView.hideController()
                          else binding.playerView.showController()
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          val p = player ?: return true
                          val forward = e.x > binding.gestureLayer.width / 2f
                          val target = (p.currentPosition + if (forward) 10_000 else -10_000)
                              .coerceIn(0, p.duration.takeIf { it > 0 } ?: Long.MAX_VALUE)
                          p.seekTo(target)
                          haptic()
                          showHud(if (forward) "+10s" else "-10s")
                          return true
                      }

                      override fun onLongPress(e: MotionEvent) {
                          val p = player ?: return
                          if (mode != 0 || scaling) return
                          longPressSpeedBackup = speedIndex
                          haptic()
                          p.playbackParameters = PlaybackParameters(2f)
                          showHud("2x  >>")
                      }

                      override fun onScroll(
                          e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float
                      ): Boolean {
                          if (e1 == null || scaling || e2.pointerCount > 1) return false
                          if (longPressSpeedBackup >= 0) return false
                          val dx = e2.x - e1.x
                          val dy = e2.y - e1.y
                          val w = binding.gestureLayer.width.toFloat()
                          val h = binding.gestureLayer.height.toFloat()

                          if (mode == 0) {
                              mode = when {
                                  abs(dx) > abs(dy) && abs(dx) > 24 -> 3
                                  abs(dy) > abs(dx) && abs(dy) > 24 -> if (e1.x < w / 2) 1 else 2
                                  else -> 0
                              }
                          }
                          when (mode) {
                              1 -> {
                                  val b = (startBrightness - dy / h).coerceIn(0.02f, 1f)
                                  window.attributes = window.attributes.also { it.screenBrightness = b }
                                  showHud("Brightness ${(b * 100).toInt()}%")
                              }
                              2 -> {
                                  val max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                  val v = (startVolume - dy / h * max * 1.2f).toInt().coerceIn(0, max)
                                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, v, 0)
                                  showHud("Volume ${(v * 100 / max)}%")
                              }
                              3 -> {
                                  val dur = player?.duration?.takeIf { it > 0 } ?: return true
                                  seekTarget = (startPos + (dx / w * 90_000).toLong()).coerceIn(0, dur)
                                  showHud("${formatDuration(seekTarget)} / ${formatDuration(dur)}")
                              }
                          }
                          return true
                      }
                  })

                  binding.gestureLayer.setOnTouchListener { v, event ->
                      scaleDetector.onTouchEvent(event)
                      if (!scaling && event.pointerCount == 1) detector.onTouchEvent(event)
                      if (event.actionMasked == MotionEvent.ACTION_UP || event.actionMasked == MotionEvent.ACTION_CANCEL) {
                          if (mode == 3) player?.seekTo(seekTarget)
                          mode = 0
                          if (longPressSpeedBackup >= 0) {
                              player?.playbackParameters = PlaybackParameters(SPEEDS[longPressSpeedBackup])
                              longPressSpeedBackup = -1
                          }
                          if (event.actionMasked == MotionEvent.ACTION_UP) v.performClick()
                      }
                      true
                  }
              }

              private fun applyZoom() {
                  // Keep the picture from being dragged completely off screen.
                  val maxX = binding.playerView.width * (zoom - 1f) / 2f
                  val maxY = binding.playerView.height * (zoom - 1f) / 2f
                  panX = panX.coerceIn(-maxX, maxX)
                  panY = panY.coerceIn(-maxY, maxY)
                  binding.playerView.scaleX = zoom
                  binding.playerView.scaleY = zoom
                  binding.playerView.translationX = panX
                  binding.playerView.translationY = panY
              }

              private fun resetZoom() {
                  zoom = 1f
                  panX = 0f
                  panY = 0f
                  applyZoom()
              }

              /** Small tick, the way Apple apps confirm a tap or a mode change. */
              private fun haptic() {
                  binding.root.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
              }

              private fun showHud(text: String) {
                  binding.hud.text = text
                  if (binding.hud.visibility != View.VISIBLE) {
                      binding.hud.alpha = 0f
                      binding.hud.visibility = View.VISIBLE
                      binding.hud.animate().alpha(1f).setDuration(120).start()
                  }
                  hudHideRunnable?.let { binding.hud.removeCallbacks(it) }
                  val hide = Runnable { binding.hud.visibility = View.GONE }
                  hudHideRunnable = hide
                  binding.hud.postDelayed(hide, 700)
              }

              // ---- Picture-in-picture ---------------------------------------------------------------

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val size = player?.videoSize
                      val ratio = if (size != null && size.width > 0 && size.height > 0)
                          (size.width.toFloat() / size.height).coerceIn(0.5f, 2.3f)
                      else 16f / 9f
                      enterPictureInPictureMode(
                          PictureInPictureParams.Builder()
                              .setAspectRatio(Rational((ratio * 1000).toInt(), 1000))
                              .build()
                      )
                  } else {
                      Toast.makeText(this, "Picture-in-picture needs Android 8 or newer", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (player?.isPlaying == true && !locked) enterPip()
              }

              override fun onPictureInPictureModeChanged(isInPip: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPip, newConfig)
                  inPip = isInPip
                  applyChrome()
              }

              // ---- Resume position (local only, SharedPreferences) -----------------------------------

              private fun prefs() = getSharedPreferences(PREFS, MODE_PRIVATE)

              private fun savedPosition(uri: Uri): Long {
                  val pos = prefs().getLong(uri.toString(), 0L)
                  return if (pos > 3000) pos - 2000 else 0L
              }

              private fun savePosition(uri: Uri, pos: Long) = prefs().edit().putLong(uri.toString(), pos).apply()
              private fun clearPosition(uri: Uri) = prefs().edit().remove(uri.toString()).apply()

              // ---- Helpers ----------------------------------------------------------------------------

              private fun displayName(uri: Uri): String {
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use {
                          if (it.moveToFirst()) return it.getString(0) ?: ""
                      }
                  } catch (e: Exception) { }
                  return uri.lastPathSegment ?: "Video"
              }

              private fun goImmersive() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowInsetsControllerCompat(window, binding.root).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }
          PLAYTAB_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PlayTab.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTab-apk
          path: PlayTab.apk

      - name: Publish APK to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PlayTab (latest build)
          body: Download PlayTab.apk below and install it on your Android phone.
          files: PlayTab.apk
