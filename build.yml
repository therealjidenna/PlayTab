      - name: Create app/src/main/java/com/example/offlineplayer/VideoRepository.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/VideoRepository.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/VideoRepository.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.content.ContentUris
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore

          data class VideoItem(
              val id: Long,
              val uri: Uri,
              val title: String,
              val folder: String,
              val durationMs: Long,
              val sizeBytes: Long
          )

          data class FolderItem(val name: String, val count: Int)

          object VideoRepository {

              /** Reads every video from the device's MediaStore. Works fully offline. */
              fun loadAll(context: Context): List<VideoItem> {
                  val result = mutableListOf<VideoItem>()
                  val collection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.DISPLAY_NAME,
                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE
                  )
                  val sort = "${MediaStore.Video.Media.DATE_ADDED} DESC"

                  context.contentResolver.query(collection, projection, null, null, sort)?.use { c ->
                      val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val nameCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                      val folderCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                      val durCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      val sizeCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                      while (c.moveToNext()) {
                          val id = c.getLong(idCol)
                          result += VideoItem(
                              id = id,
                              uri = ContentUris.withAppendedId(collection, id),
                              title = c.getString(nameCol) ?: "Unknown",
                              folder = c.getString(folderCol) ?: "Unknown",
                              durationMs = c.getLong(durCol),
                              sizeBytes = c.getLong(sizeCol)
                          )
                      }
                  }
                  return result
              }

              fun folders(videos: List<VideoItem>): List<FolderItem> =
                  videos.groupBy { it.folder }
                      .map { (name, list) -> FolderItem(name, list.size) }
                      .sortedBy { it.name.lowercase() }
          }

          fun formatDuration(ms: Long): String {
              val totalSec = ms / 1000
              val h = totalSec / 3600
              val m = (totalSec % 3600) / 60
              val s = totalSec % 60
              return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%d:%02d".format(m, s)
          }

          fun formatSize(bytes: Long): String = when {
              bytes >= 1L shl 30 -> "%.1f GB".format(bytes / (1L shl 30).toDouble())
              bytes >= 1L shl 20 -> "%.0f MB".format(bytes / (1L shl 20).toDouble())
              else -> "%d KB".format(bytes / 1024)
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/RowAdapter.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/RowAdapter.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/RowAdapter.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import android.util.Size
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import androidx.recyclerview.widget.RecyclerView
          import com.example.offlineplayer.databinding.RowItemBinding
          import java.util.concurrent.Executors

          /** One row in the list: either a folder or a video. */
          data class Row(
              val title: String,
              val subtitle: String,
              val video: VideoItem? = null,
              val folder: FolderItem? = null
          )

          class RowAdapter(
              private val context: Context,
              private val onClick: (Row) -> Unit
          ) : RecyclerView.Adapter<RowAdapter.VH>() {

              private var rows: List<Row> = emptyList()
              private val pool = Executors.newFixedThreadPool(2)
              private val main = Handler(Looper.getMainLooper())
              private val cache = object : LruCache<Long, Bitmap>(60) {}

              fun submit(newRows: List<Row>) {
                  rows = newRows
                  notifyDataSetChanged()
              }

              inner class VH(val b: RowItemBinding) : RecyclerView.ViewHolder(b.root)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =
                  VH(RowItemBinding.inflate(LayoutInflater.from(parent.context), parent, false))

              override fun getItemCount() = rows.size

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val row = rows[position]
                  holder.b.title.text = row.title
                  holder.b.subtitle.text = row.subtitle
                  holder.b.root.setOnClickListener { onClick(row) }

                  val video = row.video
                  if (video == null) {
                      holder.b.thumb.setImageResource(android.R.drawable.ic_menu_gallery)
                      holder.b.thumb.tag = null
                      return
                  }

                  holder.b.thumb.setImageDrawable(null)
                  holder.b.thumb.tag = video.id
                  cache.get(video.id)?.let { holder.b.thumb.setImageBitmap(it); return }

                  if (Build.VERSION.SDK_INT >= 29) {
                      pool.execute {
                          val bmp = try {
                              context.contentResolver.loadThumbnail(video.uri, Size(240, 160), null)
                          } catch (e: Exception) {
                              null
                          }
                          if (bmp != null) {
                              cache.put(video.id, bmp)
                              main.post {
                                  if (holder.b.thumb.tag == video.id) holder.b.thumb.setImageBitmap(bmp)
                              }
                          }
                      }
                  }
              }
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/MainActivity.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/MainActivity.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.example.offlineplayer.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var adapter: RowAdapter

              private var allVideos: List<VideoItem> = emptyList()
              private var openFolder: String? = null // null = showing the folder list

              private val permission: String
                  get() = if (Build.VERSION.SDK_INT >= 33)
                      Manifest.permission.READ_MEDIA_VIDEO
                  else
                      Manifest.permission.READ_EXTERNAL_STORAGE

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) loadVideos() else showPermissionNeeded()
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  adapter = RowAdapter(this) { row -> onRowClicked(row) }
                  binding.list.layoutManager = LinearLayoutManager(this)
                  binding.list.adapter = adapter

                  binding.grantButton.setOnClickListener { permissionLauncher.launch(permission) }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (openFolder != null) {
                              openFolder = null
                              render()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })

                  if (hasPermission()) loadVideos() else permissionLauncher.launch(permission)
              }

              override fun onResume() {
                  super.onResume()
                  if (hasPermission()) loadVideos()
              }

              private fun hasPermission() =
                  ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED

              private fun showPermissionNeeded() {
                  binding.permissionGroup.visibility = View.VISIBLE
                  binding.list.visibility = View.GONE
                  binding.empty.visibility = View.GONE
              }

              private fun loadVideos() {
                  binding.permissionGroup.visibility = View.GONE
                  Thread {
                      val videos = VideoRepository.loadAll(this)
                      runOnUiThread {
                          allVideos = videos
                          render()
                      }
                  }.start()
              }

              private fun render() {
                  val folder = openFolder
                  val rows: List<Row>
                  if (folder == null) {
                      binding.toolbar.title = "PlayTab"
                      rows = VideoRepository.folders(allVideos).map {
                          Row(it.name, "${it.count} video${if (it.count == 1) "" else "s"}", folder = it)
                      }
                  } else {
                      binding.toolbar.title = folder
                      rows = allVideos.filter { it.folder == folder }.map {
                          Row(it.title, "${formatDuration(it.durationMs)}  •  ${formatSize(it.sizeBytes)}", video = it)
                      }
                  }
                  adapter.submit(rows)
                  binding.list.visibility = if (rows.isEmpty()) View.GONE else View.VISIBLE
                  binding.empty.visibility = if (rows.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun onRowClicked(row: Row) {
                  row.folder?.let {
                      openFolder = it.name
                      render()
                      return
                  }
                  row.video?.let { v ->
                      startActivity(
                          Intent(this, PlayerActivity::class.java).apply {
                              data = v.uri
                              putExtra(PlayerActivity.EXTRA_TITLE, v.title)
                          }
                      )
                  }
              }
          }
          PLAYTAB_EOF

      - name: Create app/src/main/java/com/example/offlineplayer/PlayerActivity.kt
        run: |
          mkdir -p "$(dirname 'app/src/main/java/com/example/offlineplayer/PlayerActivity.kt')"
          cat > 'app/src/main/java/com/example/offlineplayer/PlayerActivity.kt' <<'PLAYTAB_EOF'
          package com.example.offlineplayer

          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.res.Configuration
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.util.Rational
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.TrackSelectionDialogBuilder
          import com.example.offlineplayer.databinding.ActivityPlayerBinding
          import kotlin.math.abs

          class PlayerActivity : AppCompatActivity() {

              companion object {
                  const val EXTRA_TITLE = "title"
                  private const val PREFS = "resume_positions"
                  private val SPEEDS = floatArrayOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f)
              }

              private lateinit var binding: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private lateinit var videoUri: Uri
              private lateinit var audioManager: AudioManager

              private var subtitleUri: Uri? = null
              private var speedIndex = 2
              private var hudHideRunnable: Runnable? = null

              private val subtitlePicker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) {
                          subtitleUri = uri
                          reloadWithSubtitle()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  videoUri = intent.data ?: run { finish(); return }
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  binding.titleText.text = intent.getStringExtra(EXTRA_TITLE) ?: displayName(videoUri)

                  goImmersive()
                  setupButtons()
                  setupGestures()
              }

              override fun onStart() {
                  super.onStart()
                  initPlayer()
              }

              override fun onStop() {
                  super.onStop()
                  releasePlayer()
              }

              // ---- Player setup --------------------------------------------------------

              private fun initPlayer(startAt: Long? = null) {
                  val exo = ExoPlayer.Builder(this).build()
                  player = exo
                  binding.playerView.player = exo

                  exo.setMediaItem(buildMediaItem())
                  exo.playbackParameters = PlaybackParameters(SPEEDS[speedIndex])
                  exo.seekTo(startAt ?: savedPosition())
                  exo.prepare()
                  exo.playWhenReady = true

                  exo.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_ENDED) clearPosition()
                      }
                  })
              }

              private fun buildMediaItem(): MediaItem {
                  val builder = MediaItem.Builder().setUri(videoUri)
                  subtitleUri?.let { sub ->
                      val name = displayName(sub).lowercase()
                      val mime = if (name.endsWith(".vtt")) MimeTypes.TEXT_VTT else MimeTypes.APPLICATION_SUBRIP
                      builder.setSubtitleConfigurations(
                          listOf(
                              MediaItem.SubtitleConfiguration.Builder(sub)
                                  .setMimeType(mime)
                                  .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                                  .build()
                          )
                      )
                  }
                  return builder.build()
              }

              private fun reloadWithSubtitle() {
                  val pos = player?.currentPosition ?: 0L
                  releasePlayer()
                  initPlayer(startAt = pos)
              }

              private fun releasePlayer() {
                  player?.let {
                      if (it.playbackState != Player.STATE_ENDED) savePosition(it.currentPosition)
                      it.release()
                  }
                  player = null
              }

              // ---- Top bar buttons -----------------------------------------------------

              private fun setupButtons() {
                  binding.speedButton.setOnClickListener {
                      speedIndex = (speedIndex + 1) % SPEEDS.size
                      player?.playbackParameters = PlaybackParameters(SPEEDS[speedIndex])
                      binding.speedButton.text = "${SPEEDS[speedIndex]}x".replace(".0x", "x")
                  }
                  binding.audioButton.setOnClickListener {
                      val p = player ?: return@setOnClickListener
                      TrackSelectionDialogBuilder(this, "Audio track", p, C.TRACK_TYPE_AUDIO)
                          .setAllowAdaptiveSelections(false)
                          .build()
                          .show()
                  }
                  binding.subsButton.setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Subtitles")
                          .setItems(arrayOf("Load subtitle file (.srt / .vtt)", "Pick embedded track")) { _, which ->
                              if (which == 0) {
                                  subtitlePicker.launch(arrayOf("*/*"))
                              } else {
                                  val p = player ?: return@setItems
                                  TrackSelectionDialogBuilder(this, "Subtitles", p, C.TRACK_TYPE_TEXT)
                                      .build()
                                      .show()
                              }
                          }
                          .show()
                  }
                  binding.pipButton.setOnClickListener { enterPip() }
              }

              // ---- Gestures: swipe left = brightness, right = volume, horizontal = seek,
              //      double-tap left/right = skip 10 s, single tap = toggle controls ------

              private fun setupGestures() {
                  var mode = 0 // 0 none, 1 brightness, 2 volume, 3 seek
                  var startX = 0f
                  var startPos = 0L
                  var seekTarget = 0L
                  var startBrightness = 0.5f
                  var startVolume = 0

                  val detector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean {
                          mode = 0
                          startX = e.x
                          startPos = player?.currentPosition ?: 0L
                          seekTarget = startPos
                          startBrightness = window.attributes.screenBrightness.let {
                              if (it < 0) 0.5f else it
                          }
                          startVolume = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                          return true
                      }

                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (binding.playerView.isControllerFullyVisible) binding.playerView.hideController()
                          else binding.playerView.showController()
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          val p = player ?: return true
                          val forward = e.x > binding.gestureLayer.width / 2f
                          val target = (p.currentPosition + if (forward) 10_000 else -10_000)
                              .coerceIn(0, p.duration.takeIf { it > 0 } ?: Long.MAX_VALUE)
                          p.seekTo(target)
                          showHud(if (forward) "+10s" else "-10s")
                          return true
                      }

                      override fun onScroll(
                          e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float
                      ): Boolean {
                          if (e1 == null) return false
                          val dx = e2.x - e1.x
                          val dy = e2.y - e1.y
                          val w = binding.gestureLayer.width.toFloat()
                          val h = binding.gestureLayer.height.toFloat()

                          if (mode == 0) {
                              mode = when {
                                  abs(dx) > abs(dy) && abs(dx) > 24 -> 3
                                  abs(dy) > abs(dx) && abs(dy) > 24 -> if (e1.x < w / 2) 1 else 2
                                  else -> 0
                              }
                          }
                          when (mode) {
                              1 -> {
                                  val b = (startBrightness - dy / h).coerceIn(0.02f, 1f)
                                  window.attributes = window.attributes.also { it.screenBrightness = b }
                                  showHud("Brightness ${(b * 100).toInt()}%")
                              }
                              2 -> {
                                  val max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                  val v = (startVolume - dy / h * max * 1.2f).toInt().coerceIn(0, max)
                                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, v, 0)
                                  showHud("Volume ${(v * 100 / max)}%")
                              }
                              3 -> {
                                  val dur = player?.duration?.takeIf { it > 0 } ?: return true
                                  seekTarget = (startPos + (dx / w * 90_000).toLong()).coerceIn(0, dur)
                                  showHud("${formatDuration(seekTarget)} / ${formatDuration(dur)}")
                              }
                          }
                          return true
                      }
                  })

                  binding.gestureLayer.setOnTouchListener { v, event ->
                      detector.onTouchEvent(event)
                      if (event.action == MotionEvent.ACTION_UP || event.action == MotionEvent.ACTION_CANCEL) {
                          if (mode == 3) player?.seekTo(seekTarget)
                          mode = 0
                          if (event.action == MotionEvent.ACTION_UP) v.performClick()
                      }
                      true
                  }
              }

              private fun showHud(text: String) {
                  binding.hud.text = text
                  binding.hud.visibility = View.VISIBLE
                  hudHideRunnable?.let { binding.hud.removeCallbacks(it) }
                  val hide = Runnable { binding.hud.visibility = View.GONE }
                  hudHideRunnable = hide
                  binding.hud.postDelayed(hide, 700)
              }

              // ---- Picture-in-picture --------------------------------------------------

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      enterPictureInPictureMode(
                          PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                      )
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (player?.isPlaying == true) enterPip()
              }

              override fun onPictureInPictureModeChanged(isInPip: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPip, newConfig)
                  val vis = if (isInPip) View.GONE else View.VISIBLE
                  binding.topBar.visibility = vis
                  binding.gestureLayer.visibility = vis
                  binding.playerView.useController = !isInPip
              }

              // ---- Resume position (local only, SharedPreferences) ---------------------

              private fun prefs() = getSharedPreferences(PREFS, MODE_PRIVATE)
              private fun key() = videoUri.toString()

              private fun savedPosition(): Long {
                  val pos = prefs().getLong(key(), 0L)
                  return if (pos > 3000) pos - 2000 else 0L
              }

              private fun savePosition(pos: Long) = prefs().edit().putLong(key(), pos).apply()
              private fun clearPosition() = prefs().edit().remove(key()).apply()

              // ---- Helpers -------------------------------------------------------------

              private fun displayName(uri: Uri): String {
                  contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use {
                      if (it.moveToFirst()) return it.getString(0) ?: ""
                  }
                  return uri.lastPathSegment ?: "Video"
              }

              private fun goImmersive() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowInsetsControllerCompat(window, binding.root).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }
          PLAYTAB_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PlayTab.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTab-apk
          path: PlayTab.apk

      - name: Publish APK to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PlayTab (latest build)
          body: Download PlayTab.apk below and install it on your Android phone.
          files: PlayTab.apk
